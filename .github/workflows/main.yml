name: Compilar BancaRemota

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Mostrar version de Xcode
        run: xcodebuild -version

      - name: Compilar BancaRemota
        run: |
          xcodebuild \
            -project BancaRemota.xcodeproj \
            -scheme BancaRemota \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Crear estructura IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BancaRemota.app Payload/
          zip -r BancaRemota.ipa Payload

      - name: Guardar compilacion
        uses: actions/upload-artifact@v4
        with:
          name: BancaRemota-IPA
          path: BancaRemota.ipa
          retention-days: 7
